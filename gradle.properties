# JVM 与构建性能
# 必须用 GBK 而不是 UTF-8：Gradle 的 ArgWriter 以 JVM 默认字符集写「参数文件」
# （gradle-worker-classpath*.txt），而 JDK 启动进程时按系统 ANSI 编码（本机 GBK）读该文件。
# 本机用户名路径含中文（C:\Users\紫星\），UTF-8 写入 + GBK 读出会导致 worker classpath 失效，
# 报 "Could not find or load main class worker.org.gradle...GradleWorkerMain"。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=GBK
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX（必需）
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin 代码风格
kotlin.code.style=official

# compileSdk 高于当前 AGP 的已测上限时仅提示、不阻断构建
android.suppressUnsupportedCompileSdk=37

# ── TLS 信任链修正 ────────────────────────────────────────────────────────────
# 现象：同步时 :prepareKotlinBuildScriptModel 报
#   Could not resolve gradle:gradle:9.2.0
#   Could not get resource 'https://services.gradle.org/distributions/gradle-9.2.0-src.zip'
#   javax.net.ssl.SSLHandshakeException: PKIX path building failed
# 原因：这段逻辑来自 Gradle Kotlin DSL 内置的 SourceDistributionResolver，
#       它固定访问 services.gradle.org（备用 github.com），与 distributionUrl 无关；
#       该域名证书链的信任锚不在 JDK 自带 cacerts 中，而 Windows 证书库里有
#       （浏览器能正常打开该站点即证明）。Java 不会像浏览器那样自动补全中间证书，
#       因此让 Gradle 的 JVM 改用 Windows 根证书库校验。
# 回退：删除下面这一行即可恢复默认的 JDK cacerts。
systemProp.javax.net.ssl.trustStoreType=WINDOWS-ROOT
