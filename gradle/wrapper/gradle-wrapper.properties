# Gradle 分发包地址。
#
# 版本：AGP 9.2.0 的 VersionCheckPlugin 要求 Gradle 不低于 9.4.1
#（该值取自 AGP 依赖的 com.android.SdkConstants.GRADLE_LATEST_VERSION）。
# 低于此版本时同步会报：Minimum supported Gradle version is 9.4.1. Current version is ...
#                      Try updating the 'distributionUrl' property ...
#
# 地址：官方 services.gradle.org 在本机 JVM 下会报 PKIX 证书链校验失败
#（浏览器用 Windows 证书库可正常访问，JDK 自带 cacerts 缺少该链信任锚；
#  已在 gradle.properties 中加入 systemProp.javax.net.ssl.trustStoreType=WINDOWS-ROOT）。
# 因此分发地址使用国内镜像，bin 与 src 包均已实测可下载（HTTP 200）。
# 如需改回官方地址：https://services.gradle.org/distributions/gradle-9.4.1-bin.zip
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-9.4.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
