# 工具链版本集中管理：升级 AGP 只需修改本文件。
# 本机已安装：Android SDK Platform 17（API 37.0）、Build-Tools 36.0.0、JDK 21。
# Kotlin 不由本文件钉版本（AGP 9 内置 Kotlin 支持）；Gradle 版本在 gradle/wrapper/gradle-wrapper.properties。
[versions]
agp = "9.2.0"
# Kotlin 不再单独钉版本：AGP 9.2.0 内置 Kotlin 支持（传递引入 KGP 2.2.10 与 kotlin-stdlib）
coreKtx = "1.13.1"
appcompat = "1.7.0"
material = "1.12.0"
fragment = "1.8.2"
lifecycle = "2.8.4"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
